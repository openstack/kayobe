---
fixes:
  - |
    Fixes installation of Kolla Ansible collection dependencies during
    ``kayobe control host bootstrap`` to respect a custom ``ansible.cfg`` in
    the Kayobe configuration path. Previously the ``ansible-galaxy`` commands
    run by the ``kolla-ansible`` role did not set ``ANSIBLE_CONFIG``, so
    configuration such as a custom Galaxy server list (``server_list``) was
    ignored and the default public Galaxy server was used instead.
