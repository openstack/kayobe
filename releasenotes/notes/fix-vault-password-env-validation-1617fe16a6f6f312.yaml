---
fixes:
  - |
    Fixed a vault password validation bug that caused errors when using
    ``ANSIBLE_VAULT_PASSWORD_FILE``. Users would encounter an error:
    ``The vault-ids default,default are available to encrypt. Specify the
    vault-id to encrypt with --encrypt-vault-id``. The issue occurred because
    the vault password helper was being invoked unnecessarily when only
    ``ANSIBLE_VAULT_PASSWORD_FILE`` was set.
    `LP#2160369 <https://bugs.launchpad.net/kayobe/+bug/2160369>`__
