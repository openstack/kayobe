---
# NOTE: prefer IPv4 over IPv6 in getaddrinfo() to avoid slow/failing AAAA
# lookups against hosts without real IPv6 connectivity
- name: Prefer IPv4 over IPv6 for name resolution
  become: true
  ansible.builtin.lineinfile:
    path: /etc/gai.conf
    line: "precedence ::ffff:0:0/96  100"
    create: true

- name: Install dbus for debian system
  apt:
    name: dbus
  when:
    - ansible_facts.os_family == 'Debian'
  become: true

- block:
    # NOTE(mgoddard): The CentOS image used in CI has epel-release installed,
    # but the configure-mirrors role used by Zuul disables epel. We no longer
    # install EPEL by default, but let's just be sure it's disabled.
    - name: Ensure dnf-plugins-core is installed
      package:
        name: dnf-plugins-core
        state: present

    - name: Enable the EPEL repository
      command: dnf config-manager --disable epel

    - name: Install kernel-modules-extra for running kernel
      ansible.builtin.dnf:
        name: "kernel-modules-extra-{{ ansible_facts.kernel }}"
        state: present

  when: ansible_facts.os_family == 'RedHat'
  become: true
