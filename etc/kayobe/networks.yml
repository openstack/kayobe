---
# Kayobe network configuration.

###############################################################################
# Network role to network name mappings.

# Name of the network used for admin access to the overcloud
#admin_oc_net_name:

# Name of the network used by the seed to manage the bare metal overcloud
# hosts via their out-of-band management controllers.
#oob_oc_net_name:

# Name of the network used by the seed to provision the bare metal overcloud
# hosts.
#provision_oc_net_name:

# Name of the network used by the overcloud hosts to manage the bare metal
# compute hosts via their out-of-band management controllers.
#oob_wl_net_name:

# Name of the network used by the overcloud hosts to provision the bare metal
# workload hosts.
#provision_wl_net_name:

# Name of the network used to expose the internal OpenStack API endpoints.
#internal_net_name:

# List of names of networks used to provide external network access via
# Neutron.
#external_net_names:

# Name of the network used to expose the public OpenStack API endpoints.
#public_net_name:

# Name of the network used by Neutron to carry tenant overlay network traffic.
#tunnel_net_name:

# Name of the network used to carry storage data traffic.
#storage_net_name:

# Name of the network used to carry storage management traffic.
#storage_mgmt_net_name:

# Name of the network used to perform hardware introspection on the bare metal
# workload hosts.
#inspection_net_name:

# Name of the network used to perform cleaning on the bare metal workload
# hosts
#cleaning_net_name:

###############################################################################
# Network role mapping.

# Whether the overcloud admin network is mapped to a host. Default is true for
# all hosts.
#admin_oc_net_required:

# Whether the overcloud out-of-band network is mapped to a host. Default is
# true for hosts in the seed and seed-hypervisor groups.
#oob_oc_net_required:

# Whether the overcloud provisioning network is mapped to a host. Default is
# true for hosts in the seed and seed-hypervisor groups.
#provision_oc_net_required:

# Whether the workload out-of-band network is mapped to a host. Default is true
# for hosts in controller_ironic_conductor_group when Ironic is enabled.
#oob_wl_net_required:

# Whether the workload provisioning network is mapped to a host. Default is
# true for hosts in controller_ironic_conductor_group when Ironic is enabled.
#provision_wl_net_required:

# Whether the internal network is mapped to a host. Default is true for hosts
# in the overcloud group.
#internal_net_required:

# Whether the external networks are mapped to a host. Default is true for hosts
# in controller_network_group, and for hosts in the compute group when
# kolla_enable_neutron_provider_networks is true, when Neutron is enabled.
#external_net_required:

# Whether the public network is mapped to a host. Default is true for hosts in
# controller_loadbalancer_group.
#public_net_required:

# Whether the tunnel network is mapped to a host. Default is true for hosts in
# the compute group and controller_network_group.
#tunnel_net_required:

# Whether the storage network is mapped to a host. Default is true for hosts in
# the compute, controllers and storage groups, and for hosts in
# controller_network_group when Manila is enabled.
#storage_net_required:

# Whether the storage management network is mapped to a host. Default is true
# for hosts in the storage group.
#storage_mgmt_net_required:

# Whether the inspection network is mapped to a host. Default is true for hosts
# in controller_ironic_inspector_group when Ironic is enabled.
#inspection_net_required:

# Whether the cleaning network is mapped to a host. Default is true for hosts
# in controller_ironic_conductor_group when Ironic is enabled.
#cleaning_net_required:

###############################################################################
# Default network interfaces.

# List of names of network roles. Each has a corresponding <role>_net_name or
# <role>_net_names variable, and a <role>_net_required variable.
#network_role_names:

# List of default networks to which nodes are attached.
#network_interfaces_default:

###############################################################################
# Network definitions.

# NOTE: The content of this section is very deployment-specific, since it
# depends on the names and types of networks in the deployment. It should
# define the global attributes of networks. The following example shows a basic
# configuration for a network called "example":
#
# example_cidr: 10.0.0.0/24
# example_allocation_pool_start: 10.0.0.2
# example_allocation_pool_end: 10.0.0.254
# example_gateway: 10.0.0.1
# example_vlan: 42
#
# Host or group-specific network attributes such as interface names are
# typically configured via host or group variables.
#
# Further information on the available network attributes is provided in the
# network configuration reference in the Kayobe documentation.

###############################################################################
# Network virtual patch link configuration.

# Suffix for Open vSwitch bridge names.
#network_bridge_suffix_ovs:

# Prefix for virtual patch interface names.
#network_patch_prefix:

# Suffix for virtual patch link interface names when connected towards the
# physical interface.
#network_patch_suffix_phy:

# Suffix for virtual patch link interface names when connected towards the
# OVS bridge.
#network_patch_suffix_ovs:

###############################################################################
# OpenStack Network configuration

# Whether to register networks in OpenStack. The following networks are
# registered:
# - Ironic provisioning network (defined by provision_wl_net_name)
# - Ironic inspection network (defined by inspection_net_name)
# - Ironic cleaning network (defined by cleaning_net_name)
# Default is true.
#openstack_network_registration_enabled:

###############################################################################
# Network routing table configuration.

# List of IP routing tables. Each item should be a dict containing 'id' and
# 'name' items. These tables will be added to /etc/iproute2/rt_tables.
#network_route_tables:

###############################################################################
# Systemd-networkd configuration.

# Prefix for systemd-networkd configuration file names.
#networkd_prefix:

###############################################################################
# Network connectivity check configuration.

# Whether to skip the external network connectivity check. Default is false.
#nc_skip_external_net:

# External IP address to check. Default is 8.8.8.8.
#nc_external_ip:

# External hostname to check. Default is google.com.
#nc_external_hostname:

###############################################################################
# Dummy variable to allow Ansible to accept this file.
workaround_ansible_issue_8743: yes
