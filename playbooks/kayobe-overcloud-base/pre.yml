---
- hosts: primary
  environment:
    KAYOBE_CONFIG_SOURCE_PATH: "{{ kayobe_config_src_dir }}"
  tasks:
    # NOTE(mgoddard): The kayobe dev config by default expects a bridge -
    # breth1 - to exist with an IP address of 192.168.33.3.
    - import_role:
        name: kayobe-network-bootstrap
      vars:
        bridge_interface: breth1
        bridge_ip: 192.168.33.3
        bridge_prefix: 24
        bridge_port_interface: dummy1

    # NOTE(mgoddard): Use the name zz-20-overrides.yml to ensure this takes
    # precedence over the standard config files, but can control order with the
    # priority (number after zz).
    - name: Ensure kayobe-config override config file exists
      template:
        src: overrides.yml.j2
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/zz-20-overrides.yml"

    - name: Ensure kolla-ansible globals.yml override config file exists
      template:
        src: globals.yml.j2
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/kolla/globals.yml"

    # Export an NFS share from this node for Cinder's NFS backend to use.
    - name: Ensure the NFS server package is installed
      package:
        name: "{{ 'nfs-kernel-server' if ansible_facts.os_family == 'Debian' else 'nfs-utils' }}"
        state: present
      become: true

    - name: Ensure the Cinder NFS export directory exists
      file:
        path: /export/cinder
        state: directory
        mode: "0755"
      become: true

    - name: Ensure the Cinder NFS share is exported
      # Kolla sets nas_secure_file_operations=false, so Cinder writes as root.
      copy:
        content: "/export/cinder 192.168.33.0/24(rw,sync,no_subtree_check,no_root_squash)\n"
        dest: /etc/exports
        mode: "0644"
      become: true

    - name: Ensure the NFS server is running
      service:
        name: "{{ 'nfs-kernel-server' if ansible_facts.os_family == 'Debian' else 'nfs-server' }}"
        state: started
        enabled: true
      become: true

    - name: Ensure the Cinder NFS share is active
      command: exportfs -ra
      become: true

    # The share is reached over the storage network, which is the flat aio
    # network in this environment.
    - name: Ensure the Cinder NFS shares file exists
      copy:
        content: "192.168.33.3:/export/cinder\n"
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/kolla/config/nfs_shares"
        mode: "0644"

    - name: Configure Tenks to use UEFI boot mode
      replace:
        path: "{{ kayobe_src_dir }}/dev/tenks-deploy-config-compute.yml"
        regexp: '^default_boot_mode: .*$'
        replace: 'default_boot_mode: "uefi"'
      when: ironic_boot_mode == 'uefi'

    - name: Ensure baremetal inventory exists
      template:
        src: baremetal.j2
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/inventory/baremetal"

    - name: Ensure baremetal-compute group_vars exists
      template:
        src: baremetal-compute.j2
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/inventory/group_vars/baremetal-compute"

    - name: Ensure kayobe is installed
      shell:
        cmd: dev/install.sh &> {{ logs_dir }}/ansible/install
        chdir: "{{ kayobe_src_dir }}"
        executable: /bin/bash

    - name: Configure the firewall
      shell:
        cmd: dev/configure-firewall.sh
        chdir: "{{ kayobe_src_dir }}"
        executable: /bin/bash
