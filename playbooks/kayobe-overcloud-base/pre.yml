---
- hosts: primary
  environment:
    KAYOBE_CONFIG_SOURCE_PATH: "{{ kayobe_config_src_dir }}"
  tasks:
    # NOTE(mgoddard): The kayobe dev config by default expects a bridge -
    # breth1 - to exist with an IP address of 192.168.33.3.
    - import_role:
        name: kayobe-network-bootstrap
      vars:
        bridge_interface: breth1
        bridge_ip: 192.168.33.3
        bridge_prefix: 24
        bridge_port_interface: dummy1

    - name: Determine which container images to build
      include_tasks: kolla-build-facts.yml

    - name: Prepare to build container images
      when: ci_kolla_build_images | bool
      block:
        # NOTE: Kayobe builds images as the Kayobe Ansible user, which cannot
        # read source checkouts in the zuul user's home directory.
        - name: Ensure source checkouts are readable by the Kayobe Ansible user
          shell:
            cmd: >-
              mkdir -p {{ ci_kolla_build_src_dir }}/{{ item.src_dir }} &&
              cp -a {{ ansible_env.PWD }}/{{ item.src_dir }}/. {{ ci_kolla_build_src_dir }}/{{ item.src_dir }}/ &&
              chmod -R a+rX {{ ci_kolla_build_src_dir }}
            executable: /bin/bash
          become: true
          loop: "{{ [zuul.projects['opendev.org/openstack/kolla']] + ci_kolla_build_source_projects }}"
          loop_control:
            label: "{{ item.src_dir }}"

        # NOTE: Kolla is installed from a git clone of the copied checkout,
        # which is owned by a different user.
        - name: Ensure git trusts the copied source checkouts
          command: git config --system --replace-all safe.directory '*' '^\*$'
          become: true

        - name: Include Kolla Zuul vars
          include_vars:
            file: "{{ ci_kolla_build_zuul_vars_file }}"

        - name: Ensure Kolla build config directory exists
          file:
            path: "{{ kayobe_config_src_dir }}/etc/kayobe/kolla"
            state: directory

        - name: Ensure Kolla build config file exists
          template:
            src: kolla-build.conf.j2
            dest: "{{ kayobe_config_src_dir }}/etc/kayobe/kolla/kolla-build.conf"

        # NOTE: Use Kolla's package repository overrides for the CI mirrors.
        - name: Ensure Kolla repos.yaml file exists
          template:
            src: "{{ ci_kolla_build_repos_yaml_file }}"
            dest: "{{ kayobe_config_src_dir }}/etc/kayobe/kolla/repos.yaml"
          vars:
            base_distro: "{{ 'rocky' if ansible_facts.distribution == 'Rocky' else ansible_facts.distribution | lower }}"

        # NOTE: There is no seed in this job, so build images on the
        # controller.
        - name: Ensure container images are built on the controllers
          replace:
            path: "{{ kayobe_config_src_dir }}/etc/kayobe/inventory/groups"
            regexp: '^(\[container-image-builders:children\]\n(?:#.*\n)*)seed$'
            replace: '\1controllers'

    # NOTE(mgoddard): Use the name zz-20-overrides.yml to ensure this takes
    # precedence over the standard config files, but can control order with the
    # priority (number after zz).
    - name: Ensure kayobe-config override config file exists
      template:
        src: overrides.yml.j2
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/zz-20-overrides.yml"

    - name: Ensure kolla-ansible globals.yml override config file exists
      template:
        src: globals.yml.j2
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/kolla/globals.yml"

    # Export an NFS share from this node for Cinder's NFS backend to use.
    - name: Ensure the NFS server package is installed
      package:
        name: "{{ 'nfs-kernel-server' if ansible_facts.os_family == 'Debian' else 'nfs-utils' }}"
        state: present
      become: true

    - name: Ensure the Cinder NFS export directory exists
      file:
        path: /export/cinder
        state: directory
        mode: "0755"
      become: true

    - name: Ensure the Cinder NFS share is exported
      # Kolla sets nas_secure_file_operations=false, so Cinder writes as root.
      copy:
        content: "/export/cinder 192.168.33.0/24(rw,sync,no_subtree_check,no_root_squash)\n"
        dest: /etc/exports
        mode: "0644"
      become: true

    - name: Ensure the NFS server is running
      service:
        name: "{{ 'nfs-kernel-server' if ansible_facts.os_family == 'Debian' else 'nfs-server' }}"
        state: started
        enabled: true
      become: true

    - name: Ensure the Cinder NFS share is active
      command: exportfs -ra
      become: true

    # The share is reached over the storage network, which is the flat aio
    # network in this environment.
    - name: Ensure the Cinder NFS shares file exists
      copy:
        content: "192.168.33.3:/export/cinder\n"
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/kolla/config/nfs_shares"
        mode: "0644"

    - name: Configure Tenks to use UEFI boot mode
      replace:
        path: "{{ kayobe_src_dir }}/dev/tenks-deploy-config-compute.yml"
        regexp: '^default_boot_mode: .*$'
        replace: 'default_boot_mode: "uefi"'
      when: ironic_boot_mode == 'uefi'

    - name: Ensure baremetal inventory exists
      template:
        src: baremetal.j2
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/inventory/baremetal"

    - name: Ensure baremetal-compute group_vars exists
      template:
        src: baremetal-compute.j2
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/inventory/group_vars/baremetal-compute"

    - name: Ensure kayobe is installed
      shell:
        cmd: dev/install.sh &> {{ logs_dir }}/ansible/install
        chdir: "{{ kayobe_src_dir }}"
        executable: /bin/bash

    - name: Configure the firewall
      shell:
        cmd: dev/configure-firewall.sh
        chdir: "{{ kayobe_src_dir }}"
        executable: /bin/bash
