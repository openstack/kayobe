---
- hosts: primary
  tasks:
    - name: Determine which container images to build
      include_tasks: ../kayobe-base/kolla-build-facts.yml

- hosts: primary
  environment:
    KAYOBE_CONFIG_SOURCE_PATH: "{{ kayobe_config_src_dir }}"
    KAYOBE_OVERCLOUD_CONTAINER_IMAGE_BUILD: "{{ ci_kolla_build_images | bool | ternary(1, 0) }}"
    KAYOBE_OVERCLOUD_GENERATE_CERTIFICATES: "{{ tls_enabled | ternary(1, 0) }}"
    KAYOBE_VAULT_PASSWORD: 'test-password'
    KAYOBE_DEPLOY_CUSTOM_CONTAINER: "{{ deploy_custom_container | default(false) | ternary(1, 0) }}"
    # TODO(mgoddard): Remove this when libvirt on host is used by default.
    TENKS_CONFIG_PATH: "dev/tenks-deploy-config-compute{% if tls_enabled %}-libvirt-on-host{% endif %}.yml"
  tasks:
    - name: Ensure overcloud is deployed
      shell:
        cmd: "{{ kayobe_src_dir }}/dev/overcloud-deploy.sh &> {{ logs_dir }}/ansible/overcloud-deploy"
        executable: /bin/bash

    # Check that the deployed containers run the code from the changes under
    # test. pbr records the git commit that a package was built from in
    # pbr.json.
    - name: Check that containers include the changes under test
      when: ci_kolla_build_images | bool
      block:
        - name: Collect source commits used to build container images
          shell:
            cmd: >-
              git -C {{ ci_kolla_build_src_dir }}/{{ item.src_dir }} log -5 >
              {{ logs_dir }}/ansible/kolla-build-source-{{ item.short_name }} &&
              git -C {{ ci_kolla_build_src_dir }}/{{ item.src_dir }} rev-parse HEAD
            executable: /bin/bash
          loop: "{{ [zuul.projects['opendev.org/openstack/kolla']] + ci_kolla_build_source_projects }}"
          loop_control:
            label: "{{ item.name }}"
          register: ci_source_commits
          changed_when: false

        - name: Collect images of running containers
          shell:
            cmd: >-
              sudo {{ container_engine }} ps --format '{{ '{{' }}.Names{{ '}}' }} {{ '{{' }}.Image{{ '}}' }}' |
              tee {{ logs_dir }}/ansible/container-images
            executable: /bin/bash
          register: ci_running_containers
          changed_when: false

        - name: Collect pbr.json files from running containers
          shell:
            cmd: >-
              set -o pipefail &&
              for container in $(sudo {{ container_engine }} ps --format '{{ '{{' }}.Names{{ '}}' }}'); do
              sudo {{ container_engine }} exec $container sh -c
              'grep -H . /var/lib/kolla/venv/lib/python3.*/site-packages/*/pbr.json 2>/dev/null' |
              sed "s|^|$container: |" || true;
              done | tee {{ logs_dir }}/ansible/container-pbr-versions
            executable: /bin/bash
          register: ci_container_pbr_versions
          changed_when: false

        # NOTE: Kolla and requirements are not installed as packages in the
        # containers. Projects whose images are not deployed by this job
        # cannot be checked. Check every running container with the package
        # installed, to catch any that still run a published image.
        - name: Assert that containers were built from the changes under test
          assert:
            that:
              - package_lines | length > 0
              - stale_lines | length == 0
            fail_msg: >-
              Expected every running container with the {{ package_name }}
              package to include commit {{ item.stdout }} of
              {{ item.item.name }}. Containers with the package:
              {{ package_lines | map('regex_replace', ':.*$', '') | list }}.
              Containers without the commit:
              {{ stale_lines | map('regex_replace', ':.*$', '') | list }}.
              See container-pbr-versions in the logs.
            success_msg: >-
              All {{ package_lines | length }} running containers with the
              {{ package_name }} package include commit {{ item.stdout }} of
              {{ item.item.name }}.
          loop: >-
            {{ ci_source_commits.results |
               rejectattr('item.name', 'in', ['openstack/kolla', 'openstack/requirements']) |
               list }}
          loop_control:
            label: "{{ item.item.name }}"
          when: deployed_images | length > 0
          vars:
            # Image names of running containers, without registry or tag.
            running_images: >-
              {{ ci_running_containers.stdout_lines |
                 map('split', ' ') | map('last') |
                 map('regex_replace', ':[^/]*$', '') | map('basename') | list }}
            deployed_images: >-
              {{ running_images |
                 select('match', '(' ~ item.item.image_prefixes | join('|') ~ ')') | list }}
            # Python distribution name of the project, as used in the name of
            # its dist-info directory, e.g. networking_baremetal.
            package_name: "{{ item.item.short_name | regex_replace('[-_.]+', '_') }}"
            # Lines of container-pbr-versions for the project's package, of
            # the form <container>: <path>/pbr.json:<contents>.
            package_lines: >-
              {{ ci_container_pbr_versions.stdout_lines |
                 select('search', '/site-packages/' ~ package_name ~ '-[^/]*[.]dist-info/pbr[.]json:',
                        ignorecase=True) | list }}
            stale_lines: >-
              {{ package_lines |
                 reject('search', '"git_version": "' ~ item.stdout[:7]) | list }}

    - name: Check that hello-world custom container was deployed
      shell:
        cmd: "sudo {{ container_engine | default('docker') }} ps -a | grep node-exporter"
        executable: /bin/bash
      when: deploy_custom_container | default(false)

    # Check that passwords are Vault encrypted.
    - name: View passwords.yml using Ansible Vault
      vars:
        kayobe_venv: "{{ ansible_env.HOME }}/kayobe-venv"
      command: >-
        {{ kayobe_venv }}/bin/ansible-vault
        view
        --vault-password-file {{ kayobe_venv }}/bin/kayobe-vault-password-helper
        {{ kayobe_config_src_dir }}/etc/kayobe/kolla/passwords.yml

    - name: Ensure test Tenks cluster is deployed
      shell:
        # Pass absolute source directory, since otherwise the `chdir` will
        # cause this to fail.
        cmd: dev/tenks-deploy-compute.sh '{{ tenks_src_dir }}' &> {{ logs_dir }}/ansible/tenks-deploy
        chdir: "{{ kayobe_src_dir }}"
        executable: /bin/bash

    - block:
      - name: Get redfish node VM UUID
        shell:
          cmd: virsh domuuid red0
        become: true
        register: redfish_vm_uuid

      - name: Ensure redfish node host_vars exist
        template:
          src: red0.j2
          dest: "{{ kayobe_config_src_dir }}/etc/kayobe/inventory/host_vars/red0"

    - name: Perform testing of the virtualized machines
      shell:
        cmd: dev/overcloud-test-vm.sh &> {{ logs_dir }}/ansible/overcloud-test-vm
        chdir: "{{ kayobe_src_dir }}"
        executable: /bin/bash

    - name: Test inspection of the baremetal machines
      shell:
        cmd: dev/overcloud-test-inspect.sh &> {{ logs_dir }}/ansible/overcloud-test-inspect
        chdir: "{{ kayobe_src_dir }}"
        executable: /bin/bash
      # TODO(priteau): Fix baremetal inspect issues with UEFI
      when: ironic_boot_mode == 'bios'

    - name: Perform testing of the baremetal machines
      shell:
        cmd: dev/overcloud-test-baremetal.sh &> {{ logs_dir }}/ansible/overcloud-test-baremetal
        chdir: "{{ kayobe_src_dir }}"
        executable: /bin/bash

    - name: Register dummy baremetal compute nodes
      shell:
        cmd: >
          source {{ kayobe_src_dir }}/dev/environment-setup.sh &&
          source "${KOLLA_CONFIG_PATH:-/etc/kolla}/admin-openrc.sh" &&
          kayobe baremetal compute register &> {{ logs_dir }}/ansible/baremetal-compute-register
        executable: /bin/bash

    - name: Run network connectivity check
      shell:
        # NOTE(wszumski): Limit to overcloud as we have hosts in our inventory
        # that aren't deployed in this scenario.
        cmd: >
          source {{ kayobe_src_dir }}/dev/environment-setup.sh &&
          KAYOBE_ENVIRONMENT=aio-network-connectivity kayobe network connectivity check --limit overcloud &> {{ logs_dir }}/ansible/network-connectivity-check
        executable: /bin/bash

    - name: Run configuration dump
      shell:
        # Dump the configuration for all hosts in the inventory. This exercises
        # the kayobe_config_dump filter, including for host variables that
        # reference hostvars or undefined variables.
        cmd: >
          source {{ kayobe_src_dir }}/dev/environment-setup.sh &&
          kayobe configuration dump &> {{ logs_dir }}/ansible/configuration-dump
        executable: /bin/bash

    - name: Perform database backup
      shell:
        cmd: >
          source {{ kayobe_src_dir }}/dev/environment-setup.sh &&
          kayobe overcloud database backup &> {{ logs_dir }}/ansible/database-backup
        executable: /bin/bash
