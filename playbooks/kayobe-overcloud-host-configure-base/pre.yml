---
- hosts: primary
  tasks:
    - name: Ensure host-configure test harness dependencies are installed
      include_role:
        name: host-configure-test-harness
        tasks_from: pre

    # NOTE(mgoddard): Use the name zz-30-overrides.yml to ensure this takes
    # precedence over the standard config files and zz-20-overrides.yml from
    # kayobe-overcloud-base.
    - name: Ensure kayobe-config override config file exists
      template:
        src: overrides.yml.j2
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/zz-30-overrides.yml"

    # NOTE(mgoddard): Create two loopback devices backed by files. These will
    # be added to a software RAID volume, then added to an LVM volume group.
    - name: Ensure a storage backing file exists
      command: truncate -s 2G /tmp/storage{{ item }}
      loop: [0, 1]

    - name: Ensure the storage loopback device is created
      command: losetup /dev/loop{{ item }} /tmp/storage{{ item }}
      become: true
      loop: [0, 1]

    - name: Ensure dummy network interfaces exist
      command: ip link add dummy{{ item }} type dummy
      become: true
      loop: "{{ range(2, 8) | list }}"
      when: ansible_facts.os_family == 'Debian'

    - name: Ensure firewalld is unmasked
      ansible.builtin.systemd_service:
        name: firewalld
        masked: false
      become: true
