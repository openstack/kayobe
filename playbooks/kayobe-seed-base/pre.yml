---
- hosts: primary
  environment:
    KAYOBE_CONFIG_SOURCE_PATH: "{{ kayobe_config_src_dir }}"
  tasks:
    # NOTE(mgoddard): The kayobe dev config by default expects a bridge -
    # breth1 - to exist with an IP address of 192.168.33.5.
    - import_role:
        name: kayobe-network-bootstrap
      vars:
        bridge_interface: breth1
        bridge_ip: 192.168.33.5
        bridge_prefix: 24
        bridge_port_interface: dummy1

    # NOTE(mgoddard): Use the name zz-20-overrides.yml to ensure this takes
    # precedence over the standard config files, but can control order with the
    # priority (number after zz).
    - name: Ensure kayobe-config override config file exists
      template:
        src: overrides.yml.j2
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/zz-20-overrides.yml"

    - name: Ensure kolla-ansible globals.yml override config file exists
      template:
        src: globals.yml.j2
        dest: "{{ kayobe_config_src_dir }}/etc/kayobe/kolla/globals.yml"

    - block:
        - name: Ensure bifrost overrides directory exists
          file:
            path: "{{ kayobe_config_src_dir }}/etc/kayobe/kolla/config/bifrost"
            state: "directory"

        # NOTE(mgoddard): Use dib.yml, since it takes precedence over bifrost.yml.
        - name: Ensure bifrost overrides file exists
          template:
            src: bifrost-overrides.yml.j2
            dest: "{{ kayobe_config_src_dir }}/etc/kayobe/kolla/config/bifrost/dib.yml"
      when: not build_images

    # NOTE: The stack user cannot access the ironic-python-agent-builder source
    # code, which lives in the zuul user's home directory. Copy it to /tmp. The
    # stack user does not exist yet, so the copy is owned by root. Mark it as a
    # safe directory to allow the stack user to clone it. Some git versions
    # check the path of the .git directory, so use that.
    - block:
        - name: Create a copy of ironic-python-agent-builder source code
          copy:
            src: "{{ ansible_env.PWD ~ '/' ~ zuul.projects['opendev.org/openstack/ironic-python-agent-builder'].src_dir }}"
            dest: /tmp
            remote_src: true

        - name: Mark ironic-python-agent-builder source code as a safe directory
          command: git config --system --add safe.directory /tmp/ironic-python-agent-builder/.git
      become: true
      when: build_images | bool

    - name: Ensure kayobe is installed
      shell:
        cmd: dev/install.sh &> {{ logs_dir }}/ansible/install
        chdir: "{{ kayobe_src_dir }}"
        executable: /bin/bash
