---
# List of configuration lines to apply to the switch.
cisco_nxos_switch_config: []

# Interface configuration. Dict mapping switch interface names to configuration
# dicts. Each dict contains an optional 'description' item and a 'config' item
# which should contain a list of per-interface configuration.
cisco_nxos_switch_interface_config: {}

# Whether to save the configuration.
cisco_nxos_switch_save: false
